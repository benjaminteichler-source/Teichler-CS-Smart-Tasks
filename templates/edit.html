{% extends "base.html" %}
{% block title %}Edit Task — Smart Task Manager{% endblock %}

{% block content %}

<div class="page-center">
  <div class="card form-card form-card--wide">

    <div class="edit-header">
      <h2>Edit Task</h2>
      <a href="{{ url_for('tasks.index') }}" class="btn btn--ghost">← Back</a>
    </div>

    <form action="{{ url_for('tasks.edit', task_id=task.id) }}" method="POST" id="edit-task-form" novalidate>

      <div class="form-group">
        <label for="title">Title <span class="required">*</span></label>
        <input
          type="text"
          id="title"
          name="title"
          value="{{ task.title }}"
          required
          maxlength="120"
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" maxlength="500">{{ task.description }}</textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            {% for cat in categories %}
              <option value="{{ cat }}" {% if task.category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            {% for pri in priorities %}
              <option value="{{ pri }}" {% if task.priority == pri %}selected{% endif %}>{{ pri | capitalize }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="due_date">Due Date</label>
        <input
          type="date"
          id="due_date"
          name="due_date"
          value="{{ task.due_date if task.due_date else '' }}"
        />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary">Save Changes</button>
        <a href="{{ url_for('tasks.index') }}" class="btn btn--ghost">Cancel</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
